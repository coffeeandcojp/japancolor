<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<!-- iPad: 「ホーム画面に追加」で Safari の UI なしに全画面表示する -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="いろ">
<title>にっぽんのいろ 日めくり</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF4FC; --ink:#2A2724; --ink-soft:rgba(42,39,36,.62); --line:rgba(42,39,36,.28);
  /* 論理ビューポート単位。Fire TV 用の回転モードでは JS が入れ替える */
  --vw:1vw; --vh:1vh; --vmin:1vmin;
  --dx:0px; --dy:0px; --rot:none;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;background:var(--bg)}
body{margin:0;height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;background:var(--bg);color:var(--ink);
  font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  transition:background-color 2.4s ease,color 2.4s ease;cursor:none;
  -webkit-font-smoothing:antialiased;font-feature-settings:"palt"}
body.dark{--ink:#F4F1EA;--ink-soft:rgba(244,241,234,.66);--line:rgba(244,241,234,.30)}
#stage{position:absolute;top:0;left:0;width:100%;height:100%;
  transform:var(--rot) translate(var(--dx),var(--dy));transform-origin:0 0;
  transition:transform 60s linear}
body.rot #stage{width:100vh;height:100vw;transition:none}

/* ---------- 共通 ---------- */
.t{transition:opacity 1.8s ease,filter 1.8s ease}
#title{position:absolute;display:flex;align-items:center}
#name,#yomi{margin:0;display:flex;flex-direction:column;align-items:center}
#name{font-weight:500;line-height:1}
#name span{display:block;line-height:1.12}
#yomi{color:var(--ink-soft)}
#yomi span{display:block;line-height:1.5}
#name span,#yomi span{transition:opacity 1.6s ease,filter 1.6s ease,transform 1.6s ease;
  transition-delay:calc(var(--i,0)*110ms)}
#yomi span.r{transform:rotate(90deg)}
#stage.out .t{opacity:0;filter:blur(10px)}
#stage.out #name span,#stage.out #yomi span{opacity:0;filter:blur(14px);transform:translateY(.12em)}
#stage.out #yomi span.r{transform:rotate(90deg) translateX(.12em)}
#koyomi{position:absolute;margin:0}
#date{letter-spacing:.06em;line-height:1.3}
#clock{font-weight:400;letter-spacing:.04em;line-height:1.05;font-variant-numeric:tabular-nums}
#clock.swap{opacity:0;filter:blur(10px)}
#sekki{position:absolute;margin:0;border-left:1px solid var(--line)}
#sekki .s{letter-spacing:.14em;line-height:1.35}
#sekki .s small{font-size:.5em;letter-spacing:.1em;color:var(--ink-soft);margin-left:.6em}
#sekki .k{letter-spacing:.12em;line-height:1.35;margin-top:.2em}
#sekki .k small{display:block;font-size:.42em;letter-spacing:.16em;color:var(--ink-soft);margin-top:.3em}
#moon{position:absolute;margin:0}
#moon svg{height:auto;display:block}
#moon .mn{letter-spacing:.2em}
#moon .ma{letter-spacing:.12em;color:var(--ink-soft);margin-top:.3em}
#hint{position:absolute;left:50%;transform:translateX(-50%);letter-spacing:.2em;color:var(--ink-soft);
  opacity:0;transition:opacity .6s;white-space:nowrap}
#hint.on{opacity:1}

/* 俳句：短冊風に三句を段違いの縦書き */
#haiku{position:absolute;display:flex;flex-direction:column;align-items:flex-start}
#haiku .ku{display:flex;flex-direction:row-reverse;align-items:flex-start}
#haiku .ku p{margin:0;display:flex;flex-direction:column;align-items:center;letter-spacing:.12em}
#haiku .ku p span{display:block;line-height:1.38;transition:opacity 1.8s ease,filter 1.8s ease;
  transition-delay:calc(var(--i,0)*45ms)}
#haiku .ku p span.r{transform:rotate(90deg)}
#stage.out #haiku .ku p span{opacity:0;filter:blur(10px)}
#haiku .src{color:var(--ink-soft);letter-spacing:.18em;white-space:nowrap}

/* ---------- 横画面 ---------- */
body.land #title{right:calc(8*var(--vw));top:50%;transform:translateY(-50%);gap:calc(2.6*var(--vmin))}
body.land #name{font-size:clamp(64px,calc(17*var(--vmin)),260px);letter-spacing:.14em}
body.land #yomi{font-size:clamp(16px,calc(3.2*var(--vmin)),40px)}
body.land #koyomi{left:calc(6*var(--vw));top:calc(6*var(--vmin))}
body.land #date{font-size:clamp(20px,calc(4*var(--vmin)),54px)}
body.land #clock{font-size:clamp(48px,calc(10*var(--vmin)),150px)}
body.land #sekki{left:calc(6*var(--vw));bottom:calc(5*var(--vmin));padding-left:calc(1.6*var(--vmin))}
body.land #sekki .s{font-size:clamp(18px,calc(3.4*var(--vmin)),46px)}
body.land #sekki .k{font-size:clamp(22px,calc(4.2*var(--vmin)),58px)}
body.land #moon{left:50%;bottom:calc(5*var(--vmin));transform:translateX(-50%);text-align:center}
body.land #moon svg{width:clamp(56px,calc(11*var(--vmin)),150px);margin:0 auto calc(.8*var(--vmin))}
body.land #moon .mn{font-size:clamp(14px,calc(2.6*var(--vmin)),34px)}
body.land #moon .ma{font-size:clamp(11px,calc(1.7*var(--vmin)),22px)}
body.land #haiku{left:calc(44*var(--vw));top:47%;transform:translate(-50%,-50%)}
body.land #haiku .ku{gap:calc(1.4*var(--vmin))}
body.land #haiku .ku p{font-size:clamp(18px,calc(4.2*var(--vmin)),56px)}
body.land #haiku .ku p:nth-child(2){margin-top:calc(9*var(--vmin))}
body.land #haiku .ku p:nth-child(3){margin-top:calc(18*var(--vmin))}
body.land #haiku .src{font-size:clamp(11px,calc(1.7*var(--vmin)),22px);margin-top:calc(2.4*var(--vmin));align-self:flex-end}
body.land #hint{top:calc(4*var(--vmin));font-size:clamp(11px,calc(1.6*var(--vmin)),18px)}

/* ---------- 縦画面（9:16 の壁掛け）---------- */
body.port #title{left:56%;top:51%;transform:translate(-50%,-50%);flex-direction:row-reverse;
  gap:calc(4*var(--vw))}
/* 文字数 --n に応じて縮め、短い名前は幅基準で最大化 */
body.port #name{font-size:min(calc(28*var(--vw)),calc(44*var(--vh)/var(--n,3)));letter-spacing:.1em}
body.port #name span{line-height:1.1}
body.port #yomi{font-size:clamp(16px,calc(4.4*var(--vw)),48px)}
body.port #koyomi{left:calc(8*var(--vw));top:calc(6*var(--vh))}
body.port #date{font-size:clamp(18px,calc(4.4*var(--vw)),48px)}
body.port #clock{font-size:clamp(56px,calc(17*var(--vw)),190px)}
body.port #sekki{left:calc(8*var(--vw));bottom:calc(6*var(--vh));padding-left:calc(3*var(--vw))}
body.port #sekki .s{font-size:clamp(18px,calc(5*var(--vw)),54px)}
body.port #sekki .k{font-size:clamp(22px,calc(6.4*var(--vw)),72px)}
body.port #moon{right:calc(8*var(--vw));bottom:calc(6*var(--vh));text-align:right}
body.port #moon svg{width:clamp(56px,calc(16*var(--vw)),170px);margin:0 0 calc(1*var(--vh)) auto}
body.port #moon .mn{font-size:clamp(14px,calc(3.6*var(--vw)),40px)}
body.port #moon .ma{font-size:clamp(11px,calc(2.4*var(--vw)),26px)}
body.port #haiku{left:calc(9*var(--vw));top:50%;transform:translateY(-50%)}
body.port #haiku .ku{gap:calc(1.6*var(--vw))}
body.port #haiku .ku p{font-size:clamp(16px,calc(4.1*var(--vw)),46px)}
body.port #haiku .ku p:nth-child(2){margin-top:calc(5*var(--vh))}
body.port #haiku .ku p:nth-child(3){margin-top:calc(10*var(--vh))}
body.port #haiku .src{font-size:clamp(11px,calc(2.2*var(--vw)),22px);margin-top:calc(1.6*var(--vh))}
body.port #hint{top:calc(2.4*var(--vh));font-size:clamp(11px,calc(2.4*var(--vw)),20px)}

/* 手で日送りしたときは速く */
body.fast{transition-duration:.8s}
body.fast .t,body.fast #name span,body.fast #yomi span,body.fast #haiku .ku p span{transition-duration:.55s;transition-delay:calc(var(--i,0)*35ms)}
/* 毎分の小さな仕掛け：時計と一緒に、どれか一つのブロックが墨を入れ直すように溶け変わる */
#stage .t.re,#stage .re .t,#stage .re #name span,#stage .re #yomi span,#stage .re .ku p span{opacity:0;filter:blur(10px)}
/* ---------- 色見本帳（月の一覧パネル）---------- */
#panel{position:absolute;top:0;left:0;width:100%;height:100%;box-sizing:border-box;
  background:#ECE8E1;color:#2A2724;transform:translateY(100%);transition:transform .7s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column;padding:calc(4*var(--vmin)) calc(5*var(--vmin));z-index:5}
#panel.open{transform:translateY(0)}
#panel header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:calc(2.4*var(--vmin))}
#panel .wa{font-size:clamp(22px,calc(5*var(--vmin)),64px);letter-spacing:.2em;font-weight:500}
#panel .ym{font-size:clamp(12px,calc(2*var(--vmin)),24px);letter-spacing:.14em;color:rgba(42,39,36,.6)}
#panel .grid{flex:1;display:grid;gap:calc(1.2*var(--vmin));min-height:0}
body.land #panel .grid{grid-template-columns:repeat(8,1fr);grid-auto-rows:1fr}
body.port #panel .grid{grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr}
#panel .tile{position:relative;border-radius:3px;overflow:hidden;cursor:pointer;
  display:flex;flex-direction:column;justify-content:space-between;padding:calc(1*var(--vmin));box-sizing:border-box;
  -webkit-tap-highlight-color:transparent}
#panel .tile .d{font-size:clamp(10px,calc(1.8*var(--vmin)),20px);letter-spacing:.08em;opacity:.75;font-variant-numeric:tabular-nums}
#panel .tile .n{font-size:clamp(10px,calc(1.9*var(--vmin)),22px);letter-spacing:.1em;line-height:1.25}
#panel .tile .y{font-size:clamp(8px,calc(1.2*var(--vmin)),14px);letter-spacing:.08em;opacity:.7;display:block;margin-top:.15em}
#panel .tile.today{box-shadow:inset 0 0 0 2px currentColor}
#panel .tile.today .d::after{content:"・今日";letter-spacing:.1em}
#panel .tile.dk{color:#F4F1EA}
#panel .tile.lt{color:#2A2724}
@media (prefers-reduced-motion:reduce){body,#stage,.t,#name span,#yomi span,#clock{transition:none}}
</style>
</head>

  <div id="haiku"><div class="ku"></div><div class="src t"></div></div>
  <div id="sekki" class="t"><div class="s"></div><div class="k"></div></div>
  <div id="moon" class="t"><svg viewBox="-52 -52 104 104"></svg><div class="mn"></div><div class="ma"></div></div>
</div>
<div id="panel"><header><div class="wa"></div><div class="ym"></div></header><div class="grid"></div></div>

function haikuFor(d){
  const key=String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  let pick=HAIKU[HAIKU.length-1];
  for(const h of HAIKU){if(h[0]<=key)pick=h}
  return pick;
}

["鴻雁来","こうがんきたる"],["菊花開","きくのはなひらく"],["蟋蟀在戸","きりぎりすとにあり"],
["霜始降","しもはじめてふる"],["霎時施","こさめときどきふる"],["楓蔦黄","もみじつたきばむ"],
["山茶始開","つばきはじめてひらく"],["地始凍","ちはじめてこおる"],["金盞香","きんせんかさく"],
["虹蔵不見","にじかくれてみえず"],["朔風払葉","きたかぜこのはをはらう"],["橘始黄","たちばなはじめてきばむ"],
["閉塞成冬","そらさむくふゆとなる"],["熊蟄穴","くまあなにこもる"],["鱖魚群","さけのうおむらがる"],
["乃東生","なつかれくさしょうず"],["麋角解","さわしかのつのおつる"],["雪下出麦","ゆきわたりてむぎのびる"],
["芹乃栄","せりすなわちさかう"],["水泉動","しみずあたたかをふくむ"],["雉始雊","きじはじめてなく"],
["款冬華","ふきのはなさく"],["水沢腹堅","さわみずこおりつめる"],["鶏始乳","にわとりはじめてとやにつく"]];
const MOON_NAMES={0:"新月",1:"繊月",2:"二日月",3:"三日月",7:"上弦の月",10:"十日夜",13:"十三夜",14:"小望月",15:"満月",16:"十六夜",17:"立待月",18:"居待月",19:"寝待月",20:"更待月",23:"下弦の月",26:"有明月",29:"晦"};
const WD=["日","月","火","水","木","金","土"];

// ---- 天文計算（簡易・誤差数時間以内） ----
function jd(d){return d.getTime()/86400000+2440587.5}
function sunLon(d){ // 太陽の視黄経（度）Meeus 簡易式
  const T=(jd(d)-2451545)/36525;
  const L0=280.46646+36000.76983*T+0.0003032*T*T;
  const M=(357.52911+35999.05029*T-0.0001537*T*T)*Math.PI/180;
  const C=(1.914602-0.004817*T)*Math.sin(M)+(0.019993-0.000101*T)*Math.sin(2*M)+0.000289*Math.sin(3*M);
  const om=(125.04-1934.136*T)*Math.PI/180;
  let l=L0+C-0.00569-0.00478*Math.sin(om);
  return ((l%360)+360)%360;
}
function moonAge(d){ // 2000-01-06 18:14 UTC の朔を基準
  const syn=29.530588853;
  let a=(jd(d)-2451550.26)%syn; if(a<0)a+=syn; return a;
}
// JST の「その日の正午」で暦を評価
function noonJST(d){return new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),3,0,0))}

function moonPath(age){
  const f=age/29.530588853, r=46, rx=Math.abs(Math.cos(2*Math.PI*f))*r;
  let p;
  if(f<0.5){ // 上弦側：右が明るい
    p=`M0,-${r} A${r},${r} 0 0 1 0,${r} A${rx},${r} 0 0 ${f<0.25?0:1} 0,-${r}Z`;
  }else{
    p=`M0,-${r} A${r},${r} 0 0 0 0,${r} A${rx},${r} 0 0 ${f<0.75?0:1} 0,-${r}Z`;
  }
  return `<circle r="${r}" fill="none" stroke="currentColor" stroke-opacity=".45" stroke-width="1.2"/><path d="${p}" fill="currentColor"/>`;
}

function lum(hex){const n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
  const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};
  return .2126*f(r)+.7152*f(g)+.0722*f(b)}

let offset=0; // 日付オフセット（リモコン左右でプレビュー）
function targetDate(){const d=new Date();d.setDate(d.getDate()+offset);return d}

// じわっと消えて、じわっと現れる
let fading=null;
function render(fast){
  const stage=document.getElementById('stage');
  if(fading){clearTimeout(fading)}
  document.body.classList.toggle('fast',!!fast);
  stage.classList.add('out');
  fading=setTimeout(()=>{draw();requestAnimationFrame(()=>requestAnimationFrame(()=>stage.classList.remove('out')));fading=null},fast?520:1500);
}
function draw(){
  const d=targetDate(), n=noonJST(d);
  const list=COLORS[d.getMonth()+1], c=list[(d.getDate()-1)%list.length];
  document.documentElement.style.setProperty('--bg',c[2]);
  document.body.classList.toggle('dark',lum(c[2])<0.36);
  const vert=t=>[...t].map((ch,i)=>`<span style="--i:${i}"${/[ー〜]/.test(ch)?' class="r"':''}>${ch}</span>`).join('');
  const nameEl=document.getElementById('name');
  nameEl.innerHTML=vert(c[0]); nameEl.style.setProperty('--n',[...c[0]].length);
  document.getElementById('yomi').innerHTML=vert(c[1]);
  const hk=haikuFor(d), parts=hk[1].split('／');
  let gi=0;
  document.querySelector('#haiku .ku').innerHTML=parts.map(ph=>'<p>'+[...ph].map(ch=>`<span style="--i:${gi++}"${/[ー〜]/.test(ch)?' class="r"':''}>${ch}</span>`).join('')+'</p>').join('');
  document.querySelector('#haiku .src').textContent='芭蕉　'+hk[2];
  document.getElementById('date').textContent=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）`;
  const lon=sunLon(n), x=((lon-315)+360)%360;
  const s=SEKKI[Math.floor(x/15)], k=KO[Math.floor(x/5)];
  document.querySelector('#sekki .s').innerHTML=`${s[0]}<small>${s[1]}</small>`;
  document.querySelector('#sekki .k').innerHTML=`${k[0]}<small>${k[1]}</small>`;
  const age=moonAge(n), ai=Math.round(age)%30;
  document.querySelector('#moon svg').innerHTML=moonPath(age);
  document.querySelector('#moon .mn').textContent=MOON_NAMES[ai]||`${ai}日月`;
  document.querySelector('#moon .ma').textContent=`月齢 ${age.toFixed(1)}`;
  document.getElementById('hint').textContent=offset?`${offset>0?'+':''}${offset}日　（長押し／決定で今日に戻る　上スワイプで色見本帳）`:'';
  document.getElementById('hint').classList.toggle('on',offset!==0);
}
// 時計は分が変わるたびにブロックごと溶け変わる（秒は表示しない）
let shownMin=null;
function tick(){
  const now=new Date();
  const key=now.getHours()*60+now.getMinutes();
  if(key===shownMin)return;
  const el=document.getElementById('clock');
  const text=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  if(shownMin===null){el.textContent=text}
  else if(key===0){render()}                                  // 日付が変わる：全体が溶け変わる
  else if(now.getMinutes()===0){                              // 正時：画面全体を入れ直す
    el.classList.add('swap');setTimeout(()=>{el.textContent=text;el.classList.remove('swap')},1500);
    render();
  }else{                                                      // 毎分：時計＋どれか一つのブロック
    el.classList.add('swap');
    const order=['#haiku','#title','#sekki','#moon','#date'];
    const target=document.querySelector(order[(key)%order.length]);
    const spans=target.querySelectorAll('span');
    target.classList.add('re');
    setTimeout(()=>{el.textContent=text;el.classList.remove('swap');target.classList.remove('re')},1500);
  }
  shownMin=key;
}
// ---- 色見本帳パネル ----
const WAFUU=['睦月','如月','弥生','卯月','皐月','水無月','文月','葉月','長月','神無月','霜月','師走'];
let panelOpen=false, panelY=null, panelM=null;
function openPanel(){const d=targetDate();panelY=d.getFullYear();panelM=d.getMonth();drawPanel();panelOpen=true;document.getElementById('panel').classList.add('open')}
function closePanel(){panelOpen=false;document.getElementById('panel').classList.remove('open')}
function shiftPanel(n){panelM+=n;if(panelM>11){panelM=0;panelY++}if(panelM<0){panelM=11;panelY--}drawPanel()}
function drawPanel(){
  const list=COLORS[panelM+1], days=new Date(panelY,panelM+1,0).getDate(), today=new Date();
  document.querySelector('#panel .wa').textContent=WAFUU[panelM];
  document.querySelector('#panel .ym').textContent=`${panelY}年${panelM+1}月　${days}色`;
  let html='';
  for(let dd=1;dd<=days;dd++){
    const c=list[(dd-1)%list.length];
    const isToday=panelY===today.getFullYear()&&panelM===today.getMonth()&&dd===today.getDate();
    html+=`<div class="tile ${lum(c[2])<0.36?'dk':'lt'}${isToday?' today':''}" data-d="${dd}" style="background:${c[2]}"><div class="d">${dd}</div><div class="n">${c[0]}<span class="y">${c[1]}</span></div></div>`;
  }
  document.querySelector('#panel .grid').innerHTML=html;
}
document.getElementById('panel').addEventListener('click',e=>{
  const t=e.target.closest('.tile'); if(!t)return;
  const pick=new Date(panelY,panelM,+t.dataset.d), now=new Date();
  offset=Math.round((new Date(pick.getFullYear(),pick.getMonth(),pick.getDate())-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/86400000);
  closePanel(); render(true);
});

// 焼き付き対策：数分ごとに全体をわずかにずらす
function drift(){const x=(Math.random()*2-1)*1.2,y=(Math.random()*2-1)*1.2;
  const r=document.documentElement.style;r.setProperty('--dx',x+'vmin');r.setProperty('--dy',y+'vmin')}

// ---- 向きの判定 ----
// ?rot=90 / ?rot=270 : Fire TV のように横出力しかできない機器を、物理的に縦置きしたモニターへ映すとき
const ROT=parseInt(new URLSearchParams(location.search).get('rot'))||0;
function applyOrientation(){
  const b=document.body, r=document.documentElement.style;
  if(ROT===90||ROT===270){
    b.classList.add('rot');
    r.setProperty('--vw','1vh'); r.setProperty('--vh','1vw');
    r.setProperty('--rot', ROT===90?'rotate(90deg) translateY(-100%)':'rotate(-90deg) translateX(-100%)');
    b.classList.add('port'); b.classList.remove('land');
  }else{
    const portrait=matchMedia('(max-aspect-ratio: 1/1)').matches;
    b.classList.toggle('port',portrait); b.classList.toggle('land',!portrait);
  }
}
addEventListener('resize',applyOrientation);
// タッチ操作：左スワイプで翌日、右スワイプで前日、長押しで今日に戻る（単純なタップでは変わらない）
let tx=0,ty=0,tt=0,tmoved=false;
document.addEventListener('touchstart',e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY;tt=Date.now();tmoved=false},{passive:true});
document.addEventListener('touchmove',e=>{const t=e.touches[0];if(Math.hypot(t.clientX-tx,t.clientY-ty)>12)tmoved=true},{passive:true});
document.addEventListener('touchend',e=>{
  const t=e.changedTouches[0], dx=t.clientX-tx, dy=t.clientY-ty, dt=Date.now()-tt;
  if(Math.abs(dy)>70 && Math.abs(dy)>Math.abs(dx)*1.5){      // 縦スワイプ：見本帳の開閉
    if(dy<0&&!panelOpen)openPanel(); else if(dy>0&&panelOpen)closePanel();
    return;
  }
  if(panelOpen){                                              // 見本帳の上では横スワイプで前月・翌月
    if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5){shiftPanel(dx<0?1:-1)}
    return;
  }
  if(!tmoved && dt>600){offset=0;render(true);return}        // 長押し → 今日
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5){      // 横スワイプ
    if(dx<0){offset++} else {offset--}
    render(true);
  }
},{passive:true});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowUp'){if(!panelOpen)openPanel();return}
  if(e.key==='ArrowDown'){if(panelOpen)closePanel();return}
  if(panelOpen){
    if(e.key==='ArrowRight')shiftPanel(1); else if(e.key==='ArrowLeft')shiftPanel(-1);
    else if(e.key==='Escape'||e.key==='Backspace'||e.key==='GoBack')closePanel();
    return;
  }
  if(e.key==='ArrowRight'){offset++;render(true)}
  else if(e.key==='ArrowLeft'){offset--;render(true)}
  else if(e.key==='Enter'||e.key==='Escape'||e.key==='Backspace'||e.key==='GoBack'){offset=0;render(true)}
  else if(e.key==='f'||e.key==='F'){document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}
});
applyOrientation();
document.getElementById('stage').classList.add('out');draw();
requestAnimationFrame(()=>requestAnimationFrame(()=>document.getElementById('stage').classList.remove('out')));
setTimeout(tick,1600);setInterval(tick,1000);setInterval(drift,180000);
</script>
